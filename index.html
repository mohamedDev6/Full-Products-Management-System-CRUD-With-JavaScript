<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Full Products Management System CRUD With JavaScript</title>
        <link rel="stylesheet" href="./Styles/style.css" />
    </head>
    <body>
        <div class="crud-container">
            <div class="head">
                <h1>Products Management System</h1>
            </div>

            <div class="inputs">
                <input type="text" id="name" placeholder="Product Name" />
                <input type="number" id="id" placeholder="Product ID" />

                <div class="price">
                    <input type="number" id="price" placeholder="Product Price" />
                    <input type="number" id="taxes" placeholder="Product Taxes" />
                    <input type="number" id="ads" placeholder="Product Ads" />
                    <input type="number" id="discount" placeholder="Product Discount" />
                    <div id="total">Total: $0</div>
                </div>

                <input type="number" id="count" placeholder="Product Count" />
                <input type="text" id="category" placeholder="Product Category" />
                <button id="submit-btn">Add Product</button>
            </div>

            <div class="outputs">
                <div class="search-product">
                    <input type="text" id="search" placeholder="Search" />
                    <div class="search-btn">
                        <button id="search-id">Search By ID</button>
                        <button id="search-name">Search By Name</button>
                        <button id="search-category">Search By Category</button>
                    </div>
                </div>

                <button id="delete-all-btn"></button>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Product Name</th>
                                <th>Price</th>
                                <th>Taxes</th>
                                <th>Ads</th>
                                <th>Discount</th>
                                <th>Total</th>
                                <th>Category</th>
                                <th>Stock</th>
                                <th>Update</th>
                                <th>Reduce</th>
                                <th>Delete</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="./Js/script.js"></script>
    </body>
</html>
